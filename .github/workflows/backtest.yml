name: Prueba histórica

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás"
        default: "21"
  push:
    branches: [main]
    paths:
      - "backtest/backtest.py"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - name: Descargar datos y medir
        env:
          DAYS: ${{ github.event.inputs.days || '21' }}
        run: python backtest/backtest.py
      - name: Guardar resultados en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/resultados
          git diff --cached --quiet || git commit -m "Resultados de la prueba histórica [skip ci]"
          git pull --rebase origin main
          git push
